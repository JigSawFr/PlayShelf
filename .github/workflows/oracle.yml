# The independent reader of the compression engine's NCAs (tests/oracle/run.sh:
# LibHac, which shares no code with PlayShelf, decrypts, checks and
# decompresses what the engine made, and refuses a changed byte). Only when
# the install code or the oracle changes, and by hand; not a required check.
name: oracle

on:
  push:
    branches: [ main ]
    paths:
      - source/install/**
      - library/boreale-kit
      - tests/oracle/**
      - tests/install/**
      - .github/workflows/oracle.yml
  pull_request:
    paths:
      - source/install/**
      - library/boreale-kit
      - tests/oracle/**
      - tests/install/**
      - .github/workflows/oracle.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run on the commit it replaces.
concurrency:
  group: oracle-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oracle:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # liblz4 for the engine's codec; the .NET SDK (any recent one: the reader
      # targets net8.0 and runs on the newer runtime, DOTNET_ROLL_FORWARD) is the
      # runner image's, else Ubuntu's; LibHac, a NuGet package, is fetched by
      # dotnet build.
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -o Dpkg::Options::=--force-unsafe-io -y --no-install-recommends liblz4-dev
          dotnet --list-sdks || sudo apt-get install -o Dpkg::Options::=--force-unsafe-io -y --no-install-recommends dotnet-sdk-10.0
          dotnet --list-sdks
      - name: The engine's NCAs read back by LibHac
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_NOLOGO: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: tests/oracle/run.sh
