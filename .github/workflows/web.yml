name: web

# The web simulator (web/README.md): PlayShelf built with Emscripten, with its
# demo library server (tools/web_demo.cpp), then played in headless Chromium
# (tools/web_smoke.py); and the website (site/README.md) with the simulator in
# it. For main and for each pull request: the `site` artifact, which
# pages.yml publishes on GitHub Pages (main's at the root, a pull request's in
# pr-<number>/).
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the build of the commit it replaces.
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Emscripten, pinned: a new one is a pull request of its own (its ports, its
  # threads and its file packager can change).
  EMSDK_VERSION: 6.0.12
  # The emsdk tool itself, at that version's tag, checked against the commit
  # the tag pointed to when pinned: a tag can be moved, a commit cannot.
  EMSDK_COMMIT: 35ff8a6d150541276abbc6bae512ca90bcfbe220
  # Playwright, pinned, for the smoke test and the website's screenshots.
  PLAYWRIGHT_VERSION: 1.64.0
  # axe-core, for the website's accessibility (tools/site_layout.py): its
  # npm package, checked against the hash it had when pinned.
  AXE_VERSION: 4.13.0
  AXE_SHA256: 096912f6e77b4b695fc9304b7be65091db42d98de054da674ae222a11cb33f70

jobs:
  simulator:
    runs-on: ubuntu-26.04
    # A cold start (no Emscripten cache: its system libraries and ports built
    # for threads, every file compiled, an Ubuntu mirror at a few kB/s now and
    # then) took 38 minutes before the smoke test; the caches, saved once a
    # run succeeds, bring the next ones down to minutes.
    timeout-minutes: 90
    permissions:
      contents: read
      pages: read   # the site's address (a custom domain, once it has one)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # The history, without old files' contents: the website's
          # documentation of the latest release comes out of its tag.
          fetch-depth: 0
          filter: blob:none
      # Emscripten's cache: its system libraries and ports (SDL2, zlib), built
      # for threads and exceptions on first use, which takes minutes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.emscripten_cache
          key: emscripten-${{ env.EMSDK_VERSION }}
      # The compiler's own cache: main's, saved by main's builds only (a pull
      # request's would only serve itself).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ env.EMSDK_VERSION }}-${{ github.sha }}
          restore-keys: ccache-web-${{ env.EMSDK_VERSION }}-
      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT" \
            || { echo "::error::emsdk's $EMSDK_VERSION tag is not $EMSDK_COMMIT any more"; exit 1; }
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      # The demo server's packages are made on the host (libzstd, zlib);
      # Japanese, Korean and Chinese drawn with a CJK font cut out of Noto
      # Sans CJK with fontTools (tools/web_cjk_font.py); the website's
      # documentation is Markdown (tools/build_site.py).
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libzstd-dev zlib1g-dev fonts-noto-cjk python3-fonttools python3-markdown ccache
      - name: The simulator
        env:
          PLAYSHELF_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYSHELF_PR: ${{ github.event.pull_request.number }}
        run: |
          # After emsdk_env.sh, which unsets EM_CACHE: set before, the ports
          # were built in emsdk's own folder and the cache above stayed empty.
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          export EM_CACHE="$HOME/.emscripten_cache"
          make web JOBS="$(nproc)" CMAKE_ARGS="-DPLAYSHELF_WERROR=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          ccache --show-stats || true
          test -f build-web/simulator/cjk.otf || { echo "::error::no CJK font in the web build"; exit 1; }
          {
            echo "### The web simulator"
            echo
            echo "| File | Size | Compressed |"
            echo "|---|---|---|"
            for f in playshelf.wasm playshelf.data playshelf.js cjk.otf; do
              echo "| \`$f\` | $(du -k "build-web/simulator/$f" | cut -f1) KB | $(gzip -9c "build-web/simulator/$f" | wc -c | awk '{print int($1/1024)}') KB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ env.EMSDK_VERSION }}-${{ github.sha }}
      # The simulator in headless Chromium (tools/web_smoke.py): every kind
      # of start, every tab, a game of the demo server installed, a live
      # setting, the steps link, the tour, the CJK font, keep=1, a phone, the
      # service worker. Its scenarios a few at once; one that hangs is
      # stopped and fails, rather than the job's timeout.
      - name: The simulator in a browser
        timeout-minutes: 15
        run: |
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install -q "playwright==$PLAYWRIGHT_VERSION"
          sudo "$RUNNER_TEMP/playwright/bin/python" -m playwright install-deps chromium
          "$RUNNER_TEMP/playwright/bin/python" -m playwright install chromium
          "$RUNNER_TEMP/playwright/bin/python" -u tools/web_smoke.py build-web/simulator build-web/shots
          if [ -f build-web/shots/timings.json ]; then
            { echo; echo "Starts (s): $(python3 -c 'import json; print(", ".join(f"{k} {v}" for k, v in json.load(open("build-web/shots/timings.json")).items()))')"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The site's address, as GitHub Pages serves it: its custom domain
      # when it has one, else <owner>.github.io/<repo>/; a pull request's
      # preview in its pr-<number>/. The pages' absolute links (canonical,
      # other languages, sitemap, llms.txt) are that address, and 404.html,
      # served at any path, starts its links from its path. A preview is
      # kept out of search engines.
      - name: The site's address
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # https when Pages enforces it, whatever html_url says meanwhile.
          # No Pages site yet (404): gh prints its error body on stdout, so
          # nothing of a failed call is kept.
          if ! pages=$(gh api "repos/$REPO/pages" \
                         --jq 'if .https_enforced then (.html_url | sub("^http:"; "https:")) else .html_url end' 2>/dev/null); then
            pages=""
          fi
          owner="${REPO%%/*}"
          pages="${pages:-https://${owner,,}.github.io/${REPO#*/}/}"
          pages="${pages%/}/"
          {
            echo "SITE_URL=$pages${PR:+pr-$PR/}"
            echo "SITE_BASE=/${pages#*://*/}${PR:+pr-$PR/}"
            echo "SITE_NOINDEX=${PR:+1}"
          } | tee -a "$GITHUB_ENV"
      # The website's screenshots, each screen of its gallery in each of its
      # languages, in the dark theme the site shows (tools/site_screenshots.py),
      # from the simulator just built: about 40 seconds each, the languages
      # one per processor. Taken again only when what they show can change:
      # the simulator's sources, the submodule, the site's languages, the
      # script and the versions of Emscripten and Playwright. Otherwise the
      # last ones are reused (a pull request of docs, of the site's texts, of
      # CI). Their only difference from one run to the next is the clock.
      - name: The screenshots' inputs
        id: shots-inputs
        run: |
          key=$({ git ls-tree HEAD source resources web library CMakeLists.txt Makefile \
                    tools/web_demo.cpp tools/web_cjk_font.py tools/site_screenshots.py
                  ls site/i18n
                  echo "$EMSDK_VERSION $PLAYWRIGHT_VERSION"; } | sha256sum | cut -c1-16)
          echo "key=site-shots-$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: shots
        with:
          path: shots
          key: ${{ steps.shots-inputs.outputs.key }}
      - name: The website's screenshots
        if: steps.shots.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          "$RUNNER_TEMP/playwright/bin/python" -u tools/site_screenshots.py build-web/simulator shots
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.shots.outputs.cache-hit != 'true'
        with:
          path: shots
          key: ${{ steps.shots-inputs.outputs.key }}
      - name: The website's screenshots, reused
        if: steps.shots.outputs.cache-hit == 'true'
        run: |
          echo "The website's screenshots: reused (nothing they show has changed)." >> "$GITHUB_STEP_SUMMARY"
      - name: The website, the simulator in it
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # SITE_URL, SITE_BASE, SITE_NOINDEX: the site's address (above).
          # SITE_SIMULATOR: what it downloads, said on its buttons.
          export SITE_SCREENSHOTS=shots SITE_SIMULATOR=build-web/simulator
          python3 tools/build_site.py out .
          # Every link of the site to the site, and every #anchor (a heading
          # renamed, a translation's anchors), must lead somewhere.
          python3 tools/check_site_links.py out "$SITE_URL"
          cp -r build-web/simulator out/simulator
          cp -r build-web/shots out/simulator/shots
          # What the simulator's header says it was built from.
          python3 - <<'EOF'
          import json, os
          build = {k.lower(): os.environ[k] for k in ("REPO", "SHA", "REF", "TITLE")}
          build["pr"] = int(os.environ["PR"]) if os.environ["PR"] else None
          with open("out/simulator/build.json", "w") as f:
              json.dump(build, f)
          EOF
      # The website's layout (tools/site_layout.py): no page wider than the
      # screen on a phone, a tablet or a desktop, no field iOS zooms into, no
      # script that throws, nothing axe finds against WCAG 2.2 AA. Seconds.
      - name: The website on a phone, a tablet and a desktop
        timeout-minutes: 5
        run: |
          curl -sfL --retry 3 -o "$RUNNER_TEMP/axe.tgz" "https://registry.npmjs.org/axe-core/-/axe-core-$AXE_VERSION.tgz"
          echo "$AXE_SHA256  $RUNNER_TEMP/axe.tgz" | sha256sum -c --quiet
          python3 -c 'import sys, tarfile; open(sys.argv[2], "wb").write(tarfile.open(sys.argv[1]).extractfile("package/axe.min.js").read())' \
            "$RUNNER_TEMP/axe.tgz" "$RUNNER_TEMP/axe.min.js"
          SITE_AXE="$RUNNER_TEMP/axe.min.js" "$RUNNER_TEMP/playwright/bin/python" -u tools/site_layout.py out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          include-hidden-files: true   # .nojekyll
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simulator
          path: |
            build-web/simulator
            build-web/shots
          if-no-files-found: ignore
          retention-days: 14
