name: release-please

# On every push to main, release-please keeps a "chore(main): release X.Y.Z"
# pull request up to date (CHANGELOG.md, version in CMakeLists.txt) from the
# conventional commits. Merging that PR creates the vX.Y.Z tag and the GitHub
# release; the build below then attaches the .nro / .zip to it. build.yml
# does not run on tags, hence the direct call.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A token of the release GitHub App, not GITHUB_TOKEN: its pushes to the
      # release PR trigger the other workflows, so the required checks report
      # on it, and it can create the vX.Y.Z tag. Without the app (not set up
      # yet), nothing is released.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: vars.RELEASE_APP_ID != ''
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # boreale.dev shows each project's latest version: tell it once the release
  # and its assets are out. Needs BOREALE_DISPATCH_TOKEN, a token allowed to
  # send repository_dispatch to JigSawFr/boreale (Contents: read and write on
  # it alone); without it, boreale.dev catches up within a day.
  boreale:
    needs: [ release-please, assets ]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Tell boreale.dev
        env:
          BOREALE_DISPATCH_TOKEN: ${{ secrets.BOREALE_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$BOREALE_DISPATCH_TOKEN" ]; then
            echo "No BOREALE_DISPATCH_TOKEN: boreale.dev shows $TAG at its daily build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          GH_TOKEN="$BOREALE_DISPATCH_TOKEN" gh api repos/JigSawFr/boreale/dispatches -f event_type=release > /dev/null \
            && echo "$TAG: boreale.dev told" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::$TAG: boreale.dev not told (its daily build will show the release)"
