<!doctype html>
<!-- The web simulator's page (web/README.md): PlayShelf's desktop simulator
     built with Emscripten, its settings in the URL and in the side panel. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only this page's own files: no inline script, nothing from elsewhere.
       'wasm-unsafe-eval' compiles PlayShelf; blob: workers are Emscripten's
       threads. GitHub Pages sends no headers, so the policy is here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PlayShelf simulator</title>
  <meta name="description" content="PlayShelf running in the browser against a simulated console and a demo library server.">
  <link rel="icon" href="icon.jpg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- From a phone's home screen: "PlayShelf", in a window of its own (the
       manifest's standalone, which older iOS reads here); no version number
       taken for a phone number. -->
  <meta name="apple-mobile-web-app-title" content="PlayShelf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#111d31">
  <link rel="stylesheet" href="simulator.css">
  <!-- The theme before the first paint (theme.js). -->
  <script src="theme.js"></script>
  <!-- Threads need a cross-origin isolated page; GitHub Pages cannot send the
       headers, so this service worker adds them (and reloads once). It also
       keeps PlayShelf's files for the next visits, and offline. -->
  <script src="sw.js"></script>
</head>
<body>
  <header class="top">
    <!-- As the website's header (site/assets/site.css): on the website the
         simulator is in simulator/, its home one level up. -->
    <a class="brand" href="../" id="home-link">
      <img src="mark.svg" alt="" width="30" height="30">
      <span class="name">Play<b>Shelf</b></span>
      <span class="tag" data-i18n="title">Simulator</span>
    </a>
    <nav class="nav" aria-label="PlayShelf">
      <a id="nav-features" href="../#features" data-i18n="nav_features">Features</a>
      <a id="nav-install" href="../#install" data-i18n="nav_install">Install</a>
      <a id="nav-docs" href="../docs/getting-started/" data-i18n="nav_docs">Documentation</a>
    </nav>
    <div class="build" id="build"></div>
    <div class="header-settings">
      <!-- On a phone a short face (the language's code, the theme's icon),
           the select over it, unseen, opening the system's list. -->
      <span class="picker picker-lang"><span class="picker-face" id="language-face" aria-hidden="true"></span>
        <select id="language-select" data-i18n-label="language"></select></span>
      <span class="picker picker-theme"><span class="picker-face" aria-hidden="true"></span>
        <select id="theme-select" data-i18n-label="theme"></select></span>
    </div>
    <button class="icon-btn panel-toggle" id="panel-toggle" type="button" aria-controls="panel" aria-expanded="true"
            data-i18n-title="settings" title="Settings">⚙</button>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="screen" id="screen">
        <canvas id="canvas" width="1280" height="720" tabindex="0" oncontextmenu="event.preventDefault()"
                aria-label="PlayShelf"></canvas>
        <div class="overlay" id="overlay">
          <div class="spinner" aria-hidden="true"></div>
          <p id="status" data-i18n="loading">Loading…</p>
          <progress id="progress" hidden></progress>
        </div>
        <div class="toast" id="toast" role="status" hidden></div>
      </div>
      <button type="button" class="fs-exit" id="fs-exit" data-i18n-label="fullscreen_exit" aria-label="Exit full screen">✕</button>

      <!-- Steps being replayed (rec=, the tour): what, and a way out. -->
      <div class="notice" id="steps-notice" role="status" hidden>
        <span id="steps-text"></span>
        <button type="button" class="btn" id="steps-stop" data-i18n="stop">Stop</button>
      </div>

      <div class="notice" id="theme-notice" role="status" hidden>
        <span data-i18n="theme_changed"></span>
        <button type="button" class="btn" id="theme-restart" data-i18n="restart">Restart</button>
      </div>

      <div class="controls">
        <p class="keys" data-i18n-html="keys"></p>
        <div class="control-actions">
          <button type="button" class="btn ghost" id="pad-toggle" aria-pressed="false" data-i18n="pad">Pad</button>
          <!-- Where the browser allows it (not an iPhone's Safari). -->
          <button type="button" class="btn ghost" id="fullscreen" data-i18n="fullscreen" hidden>Full screen</button>
          <!-- The tools: in a row on a large screen, behind a button on a phone
               (simulator.js opens it where there is room). -->
          <details class="tools" id="tools">
            <summary class="btn ghost" data-i18n="tools">Tools</summary>
            <div class="tool-list">
              <button type="button" class="btn ghost" id="shot" data-i18n="screenshot">Screenshot</button>
              <button type="button" class="btn ghost" id="record" aria-pressed="false" data-i18n="record" hidden>Record</button>
              <button type="button" class="btn ghost" id="steps-copy" data-i18n="steps_copy" data-i18n-title="steps_help">Steps link</button>
              <button type="button" class="btn ghost" id="tour" data-i18n="tour">Tour</button>
              <button type="button" class="btn ghost" id="report" data-i18n="report">Report a problem</button>
            </div>
          </details>
        </div>
      </div>

      <div class="pad" id="pad" hidden>
        <div class="pad-row shoulders">
          <button type="button" data-button="0">ZL</button><button type="button" data-button="1">L</button>
          <button type="button" data-button="7" class="small">−</button><button type="button" data-button="9" class="small">+</button>
          <button type="button" data-button="15">R</button><button type="button" data-button="16">ZR</button>
        </div>
        <div class="pad-row">
          <div class="dpad">
            <button type="button" data-button="3" class="up" aria-label="Up">▲</button>
            <button type="button" data-button="6" class="left" aria-label="Left">◀</button>
            <button type="button" data-button="4" class="right" aria-label="Right">▶</button>
            <button type="button" data-button="5" class="down" aria-label="Down">▼</button>
          </div>
          <div class="face">
            <button type="button" data-button="14" class="x">X</button>
            <button type="button" data-button="11" class="y">Y</button>
            <button type="button" data-button="13" class="a">A</button>
            <button type="button" data-button="12" class="b">B</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true" data-tab="settings" data-i18n="settings">Settings</button>
        <button type="button" role="tab" class="tab" id="tab-log" aria-controls="panel-log" aria-selected="false" tabindex="-1" data-tab="log" data-i18n="log">Log</button>
      </div>

      <div class="tab-body" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" data-body="settings">
        <!-- Main's or a release's simulator (simulator/<tag>/, pages.yml's
             releases.json): shown when there is a release's. -->
        <label class="field version" id="version-field" hidden>
          <span data-i18n="version">Version</span>
          <select id="version-select"></select>
        </label>
        <label class="field preset">
          <span data-i18n="preset">Preset</span>
          <select id="preset"></select>
        </label>
        <form id="form" autocomplete="off"></form>
        <details class="group" id="other-group">
          <summary data-i18n="other">Other parameters</summary>
          <p class="help" data-i18n="other_help"></p>
          <div id="other"></div>
          <div class="add-other">
            <input id="other-name" placeholder="name" aria-label="name">
            <input id="other-value" placeholder="value" aria-label="value">
            <button type="button" class="btn ghost" id="other-add" data-i18n="add">Add</button>
          </div>
        </details>
      </div>

      <div class="tab-body" id="panel-log" role="tabpanel" aria-labelledby="tab-log" data-body="log" hidden>
        <pre class="log" id="log"></pre>
      </div>

      <div class="panel-actions">
        <button type="button" class="btn primary" id="apply" data-i18n="apply">Apply</button>
        <button type="button" class="btn" id="copy" data-i18n="copy">Copy link</button>
        <button type="button" class="btn ghost" id="reset" data-i18n="reset">Reset</button>
        <button type="button" class="btn ghost" id="forget" data-i18n="forget" hidden>Forget the kept state</button>
      </div>
      <p class="note" data-i18n="note"></p>
    </aside>
  </main>

  <script src="sim_logic.js"></script>
  <script src="simulator.js"></script>
</body>
</html>
